<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIBAAS EDIT</title>
  <meta name="description" content="LIBAAS EDIT — curated men's fashion looks.">
  <style>
    :root {
      --bg: #f4efe8;
      --card: #fffdf9;
      --ink: #171717;
      --muted: #77716a;
      --line: #ddd5cb;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      width: min(920px, 92%);
      margin: 0 auto;
      padding: 34px 0 55px;
    }

    header {
      text-align: center;
      padding: 8px 0 28px;
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: .32em;
      font-size: clamp(34px, 8vw, 68px);
      margin: 0;
      font-weight: 500;
    }

    .sub {
      margin: 7px 0 0;
      letter-spacing: .5em;
      font-size: 12px;
    }

    .hero {
      overflow: hidden;
      border-radius: 22px;
      background: #eee8df;
      box-shadow: 0 18px 55px rgba(0,0,0,.10);
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
    }

    .products {
      margin-top: 24px;
      display: grid;
      gap: 12px;
    }

    .product {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 18px 18px 20px;
    }

    .info { min-width: 0; }
    .name {
      font-size: 17px;
      font-weight: 600;
      margin: 0 0 5px;
    }

    .price {
      color: var(--muted);
      font-size: 15px;
      margin: 0;
    }

    .buy {
      flex: 0 0 auto;
      border: 0;
      border-radius: 999px;
      padding: 13px 19px;
      background: #171717;
      color: white;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
      text-decoration: none;
      font-size: 12px;
    }

    .buy:hover { opacity: .84; }

    .instagram {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      letter-spacing: .05em;
    }

    .instagram:hover { text-decoration: underline; }

    @media (max-width: 560px) {
      .wrap { padding-top: 22px; }
      .product { padding: 15px; }
      .buy { padding: 12px 14px; }
      .name { font-size: 15px; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header>
      <h1 class="brand">LIBAAS</h1>
      <div class="sub">EDIT</div>
    </header>

    <section class="hero">
      <img src="libaas-edit.png" alt="Libaas Edit fashion collection">
    </section>

    <section class="products" aria-label="Shop this look">
      <div class="product">
        <div class="info">
          <p class="name">Ribbed Sweater</p>
          <p class="price">₹532</p>
        </div>
        <!-- Replace YOUR_SHIRT_AFFILIATE_LINK with your Myntra affiliate link -->
        <a class="buy" href="YOUR_SHIRT_AFFILIATE_LINK" target="_blank" rel="noopener noreferrer">BUY SHIRT</a>
      </div>

      <div class="product">
        <div class="info">
          <p class="name">Relaxed Fit Jeans</p>
          <p class="price">₹835</p>
        </div>
        <!-- Replace YOUR_PANT_AFFILIATE_LINK with your Myntra affiliate link -->
        <a class="buy" href="YOUR_PANT_AFFILIATE_LINK" target="_blank" rel="noopener noreferrer">BUY PANT</a>
      </div>
    </section>

    <a class="instagram" href="https://www.instagram.com/libaas__room/" target="_blank" rel="noopener noreferrer">
      @libaas__room
    </a>
  </main>
</body>
</html>
